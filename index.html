<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kronespill – klassisk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="arcade">
    <div class="marquee">
      <div class="lamp-row">● ● ● ● ● ● ●</div>
      <h1>KRONESPILL</h1>
      <p>KLASSISK KNIPSEKASSE</p>
    </div>

    <div class="panel">
      <div class="topline">
        <div>PRØVEPENGER: <b id="money">20</b> KR</div>
        <div id="status">Sett kraft og hastighet – knips!</div>
      </div>

      <div class="game-wrap">
        <canvas id="game" width="820" height="720" aria-label="Kronespill"></canvas>

        <div class="hud">
          <div class="control">
            <label for="force">TRYKK-KRAFT <output id="forceOut">55</output>%</label>
            <input id="force" type="range" min="20" max="100" value="55">
          </div>
          <div class="control">
            <label for="speed">HASTIGHET <output id="speedOut">55</output>%</label>
            <input id="speed" type="range" min="20" max="100" value="55">
          </div>
          <button id="shoot">KNIPS KRONEN</button>
          <button id="add">+ 5 KR</button>
        </div>
      </div>

      <div class="payout">
        <span>GEVINST</span>
        <strong id="win">—</strong>
        <small>Treff en gevinstlomme nederst.</small>
      </div>
    </div>

    <footer>Gratis spilldemo · Ingen ekte penger · Klassisk stil</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
